name: Build UniversalSearch

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: universalsearch-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Restore Windows x64 target
        run: dotnet restore UniversalSearch.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -r win-x64
      - name: Build Windows x64 target
        run: dotnet build UniversalSearch.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64 --no-restore
      - name: Upload Windows build output
        uses: actions/upload-artifact@v4
        with:
          name: UniversalSearch-Windows-x64
          path: bin/Release/net10.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error
          retention-days: 14
