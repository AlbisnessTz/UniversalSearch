name: Build UniversalSearch

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Restore Windows target
        run: dotnet restore UniversalSearch.csproj -p:TargetFramework=net10.0-windows10.0.19041.0
      - name: Build Windows target
        run: dotnet build UniversalSearch.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --no-restore
